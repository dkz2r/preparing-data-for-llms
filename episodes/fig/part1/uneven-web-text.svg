<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img"
     aria-labelledby="uw-title uw-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="uw-title">Raw web text is uneven</title>
  <desc id="uw-desc">A mock web page. A cookie banner, a navigation menu, an
    advertisement, and a boilerplate footer surround a small block of clean
    article prose. Only the article prose is useful training text; everything
    around it is noise the pipeline must strip.</desc>

  <!-- page frame -->
  <rect x="6" y="6" width="748" height="458" rx="10" fill="#ffffff" stroke="#d6dee4"/>

  <!-- browser chrome -->
  <rect x="20" y="20" width="720" height="34" rx="6" fill="#eef2f5"/>
  <circle cx="40" cy="37" r="5" fill="#cdd6dd"/>
  <circle cx="58" cy="37" r="5" fill="#cdd6dd"/>
  <circle cx="76" cy="37" r="5" fill="#cdd6dd"/>
  <rect x="96" y="28" width="624" height="18" rx="9" fill="#ffffff" stroke="#d6dee4"/>
  <text x="108" y="41" font-size="11" fill="#8a98a2">https://example.org/article</text>

  <!-- cookie banner (noise) -->
  <rect x="20" y="66" width="720" height="40" rx="6" fill="#e7ecf0" stroke="#b4540a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="34" y="91" font-size="13" fill="#5a6b75">This site uses cookies. Accept · Manage preferences</text>
  <rect x="612" y="76" width="50" height="20" rx="4" fill="#cdd6dd"/>
  <rect x="668" y="76" width="56" height="20" rx="4" fill="#cdd6dd"/>
  <text x="730" y="84" font-size="10" fill="#b4540a" text-anchor="end" font-weight="700">✕ noise</text>

  <!-- nav menu (noise) -->
  <rect x="20" y="118" width="150" height="320" rx="6" fill="#e7ecf0" stroke="#b4540a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="34" y="140" font-size="12" fill="#5a6b75" font-weight="700">Navigation</text>
  <g fill="#cdd6dd">
    <rect x="34" y="152" width="122" height="12" rx="3"/>
    <rect x="34" y="172" width="100" height="12" rx="3"/>
    <rect x="34" y="192" width="118" height="12" rx="3"/>
    <rect x="34" y="212" width="92"  height="12" rx="3"/>
    <rect x="34" y="232" width="110" height="12" rx="3"/>
    <rect x="34" y="252" width="84"  height="12" rx="3"/>
  </g>
  <text x="160" y="430" font-size="10" fill="#b4540a" text-anchor="end" font-weight="700">✕ noise</text>

  <!-- ad block (noise) -->
  <rect x="590" y="118" width="150" height="150" rx="6" fill="#e7ecf0" stroke="#b4540a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="665" y="195" font-size="22" fill="#aeb9c1" text-anchor="middle" font-weight="700">AD</text>
  <text x="730" y="260" font-size="10" fill="#b4540a" text-anchor="end" font-weight="700">✕ noise</text>

  <!-- useful article prose (keep) -->
  <rect x="182" y="118" width="396" height="200" rx="6" fill="#ffffff" stroke="#179c7d" stroke-width="2.5"/>
  <text x="198" y="142" font-size="14" fill="#0f6b56" font-weight="700">Article body</text>
  <g fill="#1c3f52">
    <rect x="198" y="156" width="360" height="11" rx="3"/>
    <rect x="198" y="176" width="364" height="11" rx="3"/>
    <rect x="198" y="196" width="348" height="11" rx="3"/>
    <rect x="198" y="216" width="360" height="11" rx="3"/>
    <rect x="198" y="236" width="330" height="11" rx="3"/>
    <rect x="198" y="256" width="356" height="11" rx="3"/>
    <rect x="198" y="276" width="300" height="11" rx="3"/>
  </g>
  <text x="562" y="312" font-size="11" fill="#0f6b56" text-anchor="end" font-weight="700">✓ keep</text>

  <!-- boilerplate footer (noise) -->
  <rect x="182" y="330" width="558" height="108" rx="6" fill="#e7ecf0" stroke="#b4540a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="196" y="352" font-size="12" fill="#5a6b75" font-weight="700">Footer · boilerplate</text>
  <g fill="#cdd6dd">
    <rect x="196" y="364" width="120" height="10" rx="3"/>
    <rect x="330" y="364" width="120" height="10" rx="3"/>
    <rect x="464" y="364" width="120" height="10" rx="3"/>
    <rect x="196" y="384" width="120" height="10" rx="3"/>
    <rect x="330" y="384" width="120" height="10" rx="3"/>
    <rect x="464" y="384" width="120" height="10" rx="3"/>
  </g>
  <text x="196" y="424" font-size="10" fill="#8a98a2">© 2024 · Terms · Privacy · Sitemap · Subscribe to our newsletter</text>
  <text x="730" y="430" font-size="10" fill="#b4540a" text-anchor="end" font-weight="700">✕ noise</text>
</svg>
