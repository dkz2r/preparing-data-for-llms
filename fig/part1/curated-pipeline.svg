<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img"
     aria-labelledby="cp-title cp-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="cp-title">Curated pipeline: the light path</title>
  <desc id="cp-desc">A two-row flow following Figure 1 of the OpenGPT-X data paper.
    Curated sources (PDF, XML, ePub) pass along the top row through format
    conversion, content normalization, and language detection, then wrap down to
    metadata normalization and light filtering, ending in the shared JSONL
    record.</desc>

  <defs>
    <marker id="cp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c3f52"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="848" height="348" rx="10" fill="#f7f9fb" stroke="#d6dee4"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#0c79b0">Curated pipeline: the light path</text>

  <!-- arrows -->
  <g stroke="#1c3f52" stroke-width="2" marker-end="url(#cp-arrow)">
    <!-- row 1, left to right -->
    <line x1="200" y1="120" x2="226" y2="120"/>
    <line x1="400" y1="120" x2="426" y2="120"/>
    <line x1="600" y1="120" x2="626" y2="120"/>
    <!-- wrap down (rightmost column) -->
    <line x1="715" y1="160" x2="715" y2="228"/>
    <!-- row 2, right to left -->
    <line x1="630" y1="270" x2="604" y2="270"/>
    <line x1="430" y1="270" x2="404" y2="270"/>
  </g>

  <g font-size="14" fill="#1c3f52" text-anchor="middle">
    <!-- row 1 -->
    <!-- raw input: distinct neutral grey -->
    <rect x="30"  y="80" width="170" height="80" rx="8" fill="#e6eaed" stroke="#6b7b85" stroke-width="2"/>
    <text x="115" y="115" font-weight="700">Curated sources</text>
    <text x="115" y="137">PDF · XML · ePub</text>

    <rect x="230" y="80" width="170" height="80" rx="8" fill="#e1eef6" stroke="#0c79b0" stroke-width="2"/>
    <text x="315" y="115" font-weight="700">1 · Format</text>
    <text x="315" y="137">conversion</text>

    <rect x="430" y="80" width="170" height="80" rx="8" fill="#e1eef6" stroke="#0c79b0" stroke-width="2"/>
    <text x="515" y="115" font-weight="700">2 · Content</text>
    <text x="515" y="137">normalization</text>

    <rect x="630" y="80" width="170" height="80" rx="8" fill="#e1eef6" stroke="#0c79b0" stroke-width="2"/>
    <text x="715" y="115" font-weight="700">3 · Language</text>
    <text x="715" y="137">detection</text>

    <!-- row 2 (reads right to left) -->
    <rect x="630" y="230" width="170" height="80" rx="8" fill="#e1eef6" stroke="#0c79b0" stroke-width="2"/>
    <text x="715" y="265" font-weight="700">4 · Metadata</text>
    <text x="715" y="287">normalization</text>

    <rect x="430" y="230" width="170" height="80" rx="8" fill="#e1eef6" stroke="#0c79b0" stroke-width="2"/>
    <text x="515" y="265" font-weight="700">5 · Light filter</text>
    <text x="515" y="287">length · lang score</text>

    <!-- shared output (green = convergence) -->
    <rect x="230" y="230" width="170" height="80" rx="8" fill="#d8efe8" stroke="#179c7d" stroke-width="2"/>
    <text x="315" y="265" font-weight="700" fill="#0f6b56">JSONL</text>
    <text x="315" y="287">shared format</text>
  </g>
</svg>
