<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 360" role="img"
     aria-labelledby="wp-title wp-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="wp-title">Web pipeline: the heavy path</title>
  <desc id="wp-desc">A two-row flow. Common Crawl data (WARC or WET) passes
    through normalization, quality scoring, harmful-content scoring, and language
    detection along the top row, then wraps down to prefilter, filter, and
    deduplicate along the bottom row, ending in the shared JSONL record.</desc>

  <defs>
    <marker id="wp-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1c3f52"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="1048" height="348" rx="10" fill="#f7f9fb" stroke="#d6dee4"/>
  <text x="30" y="40" font-size="20" font-weight="700" fill="#b4540a">Web pipeline</text>

  <!-- arrows -->
  <g stroke="#1c3f52" stroke-width="2" marker-end="url(#wp-arrow)">
    <!-- row 1, left to right -->
    <line x1="200" y1="120" x2="226" y2="120"/>
    <line x1="400" y1="120" x2="426" y2="120"/>
    <line x1="600" y1="120" x2="626" y2="120"/>
    <line x1="800" y1="120" x2="826" y2="120"/>
    <!-- wrap down (rightmost column) -->
    <line x1="915" y1="160" x2="915" y2="228"/>
    <!-- row 2, right to left -->
    <line x1="830" y1="270" x2="804" y2="270"/>
    <line x1="630" y1="270" x2="604" y2="270"/>
    <line x1="430" y1="270" x2="404" y2="270"/>
  </g>

  <!-- boxes: orange (web) -->
  <g font-size="14" fill="#1c3f52" text-anchor="middle">
    <!-- row 1: raw input in distinct neutral grey -->
    <rect x="30"  y="80" width="170" height="80" rx="8" fill="#e6eaed" stroke="#6b7b85" stroke-width="2"/>
    <text x="115" y="115" font-weight="700">Common Crawl</text>
    <text x="115" y="137">WARC · WET</text>

    <rect x="230" y="80" width="170" height="80" rx="8" fill="#fde8d6" stroke="#b4540a" stroke-width="2"/>
    <text x="315" y="115" font-weight="700">1 · Normalize</text>
    <text x="315" y="137">(aggressive)</text>

    <rect x="430" y="80" width="170" height="80" rx="8" fill="#fde8d6" stroke="#b4540a" stroke-width="2"/>
    <text x="515" y="115" font-weight="700">2 · Quality</text>
    <text x="515" y="137">scoring</text>

    <rect x="630" y="80" width="170" height="80" rx="8" fill="#fde8d6" stroke="#b4540a" stroke-width="2"/>
    <text x="715" y="115" font-weight="700">3 · Harmful</text>
    <text x="715" y="137">content scoring</text>

    <rect x="830" y="80" width="170" height="80" rx="8" fill="#fde8d6" stroke="#b4540a" stroke-width="2"/>
    <text x="915" y="115" font-weight="700">4 · Language</text>
    <text x="915" y="137">detection</text>

    <!-- row 2 (reads right to left) -->
    <rect x="830" y="230" width="170" height="80" rx="8" fill="#fde8d6" stroke="#b4540a" stroke-width="2"/>
    <text x="915" y="265" font-weight="700">5 · Prefilter</text>
    <text x="915" y="287">cheap first pass</text>

    <rect x="630" y="230" width="170" height="80" rx="8" fill="#fde8d6" stroke="#b4540a" stroke-width="2"/>
    <text x="715" y="265" font-weight="700">6 · Filter</text>
    <text x="715" y="287">quality · toxicity</text>

    <rect x="430" y="230" width="170" height="80" rx="8" fill="#fde8d6" stroke="#b4540a" stroke-width="2"/>
    <text x="515" y="265" font-weight="700">7 · Deduplicate</text>
    <text x="515" y="287">MinHash · LSH</text>

    <!-- shared output (green = convergence) -->
    <rect x="230" y="230" width="170" height="80" rx="8" fill="#d8efe8" stroke="#179c7d" stroke-width="2"/>
    <text x="315" y="265" font-weight="700" fill="#0f6b56">JSONL</text>
    <text x="315" y="287">shared format</text>
  </g>
</svg>
