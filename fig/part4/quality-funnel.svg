<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img"
     aria-labelledby="qf-title qf-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="qf-title">Cheaper judgments run on far more data</title>
  <desc id="qf-desc">A log-log scatter plot. The horizontal axis is the number of
    documents a judgment runs on, from ten thousand to a trillion. The vertical axis
    is the cost per document in euros, from about ten-millionths of a cent to ten
    euros. Three judgment tiers fall on a downward line from top-left to
    bottom-right: human review of a curated seed costs about 10 euro per document
    and runs on only a small seed; the model judge costs about 0,0003 euro per
    document and runs on the roughly five billion survivors; cheap surface filters
    and deduplication cost about 0,00000007 euro per document and run across the
    whole web. The raw web of 173 billion documents sits on the baseline, ungraded.
    The cheaper a judgment is per document, the more documents it can cover.</desc>

  <rect x="6" y="6" width="748" height="508" rx="10" fill="#f7f9fb" stroke="#d6dee4"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#005b7f">Cheaper judgments run on far more data</text>

  <!-- plot area x 120..680, y 90..430. x = log10(docs) 4..12 -> px=120+(L-4)*70.
       y = log10(cost) -8..2 -> py=430-(L+8)*34. -->

  <!-- y gridlines + labels (cost per document) -->
  <g stroke="#e3e9ee" stroke-width="1">
    <line x1="120" y1="430" x2="680" y2="430"/>
    <line x1="120" y1="362" x2="680" y2="362"/>
    <line x1="120" y1="294" x2="680" y2="294"/>
    <line x1="120" y1="226" x2="680" y2="226"/>
    <line x1="120" y1="158" x2="680" y2="158"/>
  </g>
  <g text-anchor="end" font-size="11" fill="#5a6b77">
    <text x="112" y="434">0,00000001 &#8364;</text>
    <text x="112" y="366">0,000001 &#8364;</text>
    <text x="112" y="298">0,0001 &#8364;</text>
    <text x="112" y="230">0,01 &#8364;</text>
    <text x="112" y="162">1 &#8364;</text>
  </g>

  <!-- x labels (documents) -->
  <g text-anchor="middle" font-size="11" fill="#5a6b77">
    <text x="120" y="448">10&#8308;</text>
    <text x="260" y="448">10&#8310;</text>
    <text x="400" y="448">10&#8312;</text>
    <text x="540" y="448">10&#185;&#8304;</text>
    <text x="680" y="448">10&#185;&#178;</text>
  </g>

  <!-- axes -->
  <line x1="120" y1="90" x2="120" y2="430" stroke="#1c3f52" stroke-width="1.5"/>
  <line x1="120" y1="430" x2="680" y2="430" stroke="#1c3f52" stroke-width="1.5"/>
  <text x="400" y="476" font-size="13.5" font-weight="700" fill="#1c3f52" text-anchor="middle">Documents the judgment runs on (log scale)</text>
  <text x="40" y="260" font-size="13.5" font-weight="700" fill="#1c3f52" text-anchor="middle" transform="rotate(-90 40 260)">Cost per document (log scale)</text>

  <!-- trade-off line through the three judgment tiers -->
  <polyline points="190,124 519,278 627,401" fill="none" stroke="#9fb2bf" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- raw web: the ungraded starting pile, on the baseline at the high-volume end -->
  <circle cx="658" cy="423" r="7" fill="none" stroke="#5a6b77" stroke-width="2"/>
  <text x="648" y="427" font-size="11.5" fill="#5a6b77" text-anchor="end">raw web (ungraded)</text>

  <!-- judgment points -->
  <g>
    <!-- human review (top-left) -->
    <circle cx="190" cy="124" r="8" fill="#a8430a"/>
    <text x="206" y="120" font-size="14" font-weight="700" fill="#1c3f52">Human review</text>
    <text x="206" y="138" font-size="12" fill="#5a6b77">a curated seed &#183; &#8776; 10 &#8364; each</text>

    <!-- model judge (middle) -->
    <circle cx="519" cy="278" r="8" fill="#005b7f"/>
    <text x="507" y="266" font-size="14" font-weight="700" fill="#1c3f52" text-anchor="end">Model judge</text>
    <text x="507" y="284" font-size="12" fill="#5a6b77" text-anchor="end">&#8776; 5B survivors &#183; &#8776; 0,0003 &#8364; each</text>

    <!-- surface filters + dedup (bottom-right) -->
    <circle cx="627" cy="401" r="8" fill="#005b7f"/>
    <text x="616" y="380" font-size="14" font-weight="700" fill="#1c3f52" text-anchor="end">Surface filters + dedup</text>
    <text x="616" y="396" font-size="12" fill="#5a6b77" text-anchor="end">whole web &#183; &#8776; 0,00000007 &#8364; each</text>
  </g>

  <!-- caveat / source -->
  <text x="30" y="500" font-size="11" fill="#5a6b77">Counts from Part 2 (173B raw, ~5B survive); per-document euro costs and the seed size are mid-2026 illustrations.</text>
</svg>
